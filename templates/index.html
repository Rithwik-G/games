<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Small games and experiments by Rithwik Gupta.">
  <title>Small Games — Rithwik Gupta</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script defer src="{{ url_for('static', filename='gallery.js') }}"></script>
</head>
<body>
  <header class="site-header wrap">
    <a class="wordmark" href="/" aria-label="Games home"><span>RG</span> / games</a>
    <a class="quiet-link" href="https://rithwikg.com">rithwikg.com ↗</a>
  </header>
  <main class="wrap">
    <section class="intro">
      <h1>Small<br>Games</h1>
      <p class="lede">A collection of Python games and small experiments.</p>
    </section>
    <div class="collection-heading">
      <h2>The Games</h2>
    </div>
    <section class="project-grid" aria-label="Games and projects">
      {% for project in projects %}
      <a class="project-card" href="{{ url_for('play', slug=project.slug) }}" data-preview="{{ project.slug }}" data-accent="{{ project.accent }}">
        <div class="project-preview"><canvas width="600" height="360" aria-hidden="true"></canvas></div>
        <div class="project-meta"><span>{{ "%02d"|format(loop.index) }}</span><span>{{ project.year }}</span></div>
        <h3>{{ project.title }}</h3>
        <p>{{ project.description }}</p>
        <span class="open-label">Open <i>↗</i></span>
      </a>
      {% endfor %}
    </section>
  </main>
  <footer class="site-footer wrap">
    <a href="https://github.com/Rithwik-G/games">GitHub ↗</a>
  </footer>
</body>
</html>
