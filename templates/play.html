<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f0ea">
  <title>{{ project.title }} — Rithwik’s games</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script defer src="{{ url_for('static', filename='games.js') }}"></script>
</head>
<body class="play-page" data-game="{{ project.slug }}">
  <header class="site-header wrap">
    <a class="wordmark" href="/"><span>RG</span> / games</a>
    <a class="quiet-link" href="/">← All games</a>
  </header>
  <main class="game-layout wrap">
    <section class="game-heading">
      <div><p class="eyebrow">{{ project.kind }} · {{ project.year }}</p><h1>{{ project.title }}</h1></div>
      <p>{{ project.description }}</p>
    </section>
    <section class="game-stage" aria-label="{{ project.title }} game">
      <div class="stage-bar"><span class="stage-title">{{ project.title }}</span><span id="game-status" role="status" aria-live="polite">Ready</span></div>
      <div id="game-root" class="game-root"></div>
    </section>
    <section class="game-notes">
      <div><p class="eyebrow">How to play</p><p>{{ project.controls }}</p></div>
      {% if project.source_url %}<div><p class="eyebrow">Code</p><p><a class="text-link" href="{{ project.source_url }}">View on GitHub ↗</a></p></div>{% endif %}
    </section>
    <nav class="next-projects" aria-label="More projects">
      <a href="/">← All games</a><button id="global-restart" type="button">Restart</button>
    </nav>
  </main>
</body>
</html>
